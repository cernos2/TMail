rules {
  # Real malware: refused at SMTP time, the sender gets a bounce. Applies even to trusted senders.
  TMAIL_VIRUS_REJECT {
    action = "reject";
    expression = "CLAM_VIRUS | CLAM_SANE_MALWARE";
    # SMTP replies must be ASCII: the sender's server puts this text into the bounce.
    message = "Message rejected: a virus was found in the attachment";
    priority = 3;
  }
  TMAIL_EXEC_REJECT {
    action = "reject";
    expression = "MIME_BAD_EXTENSION | MIME_DOUBLE_BAD_EXTENSION | MIME_ARCHIVE_IN_ARCHIVE & MIME_BAD_EXTENSION";
    message = "Executable attachments (.exe, .js, .lnk, .iso...) are not accepted, even inside archives. Please send a download link instead";
    priority = 2;
  }
}
