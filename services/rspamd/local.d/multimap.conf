# Sender black / white lists managed in TMAIL (Admin → Block and allow lists).
# Matched against the From header (what the user sees), like Gmail.
# The maps are served by TMAIL itself on the loopback interface and re-read by Rspamd every minute.

# Blocked senders: always to Junk (forced "add header" = X-Spam: Yes → sieve files it into Junk).
TMAIL_BLOCK_ADDR {
  type = "header";
  header = "from";
  filter = "email:addr";
  map = "http://127.0.0.1:80/internal/rspamd/block-addr.map";
  prefilter = true;
  action = "add header";
  description = "Sender is on the TMAIL block list";
}
TMAIL_BLOCK_DOMAIN {
  type = "header";
  header = "from";
  filter = "email:domain";
  map = "http://127.0.0.1:80/internal/rspamd/block-domain.map";
  prefilter = true;
  action = "add header";
  description = "Sender domain is on the TMAIL block list";
}

# Trusted senders: never spam (a strong negative score; virus checks and other rules still run).
TMAIL_ALLOW_ADDR {
  type = "header";
  header = "from";
  filter = "email:addr";
  map = "http://127.0.0.1:80/internal/rspamd/allow-addr.map";
  score = -30.0;
  description = "Sender is on the TMAIL trusted list";
}
TMAIL_ALLOW_DOMAIN {
  type = "header";
  header = "from";
  filter = "email:domain";
  map = "http://127.0.0.1:80/internal/rspamd/allow-domain.map";
  score = -30.0;
  description = "Sender domain is on the TMAIL trusted list";
}
