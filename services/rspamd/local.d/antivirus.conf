# Every attachment is checked by ClamAV (clamav service, 127.0.0.1:3310).
# What happens with a finding is decided in force_actions.conf: real malware is refused at SMTP
# time, heuristic findings (macros, password-protected archives) only mark the letter.
clamav {
  type = "clamav";
  servers = "127.0.0.1:3310";
  scan_mime_parts = true;
  scan_text_mime = false;
  scan_image_mime = true;
  max_size = 100000000;
  timeout = 90;
  retransmits = 1;
  log_clean = false;
  symbol = "CLAM_VIRUS";
  symbol_fail = "CLAM_VIRUS_FAIL";
  # Checked in this order, first match wins (same rules as avKind in the webmail).
  patterns = [
    { CLAM_MACRO = "^Heuristics\\.OLE2\\.ContainsMacros"; },
    { CLAM_ENCRYPTED = "^Heuristics\\.Encrypted"; },
    { CLAM_LIMITS = "^Heuristics\\.Limits"; },
    { CLAM_HEURISTIC = "^Heuristics\\."; },
    { CLAM_SANE_MALWARE = "(?i)^(Sanesecurity\\.(Badmacro|Foxhole|Malware|MalwareHash|Rogue)|Porcupine\\.Malware)"; },
    { CLAM_SANE_SPAM = "^(Sanesecurity|Porcupine)\\."; },
  ];
}
