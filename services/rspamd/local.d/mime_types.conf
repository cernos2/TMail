  exe = 10, scr = 10, com = 10, pif = 10, bat = 10, cmd = 10, vbs = 10, vbe = 10, js = 10, jse = 10,
  wsf = 10, wsh = 10, wsc = 10, hta = 10, ps1 = 10, psm1 = 10, lnk = 10, msi = 10, msp = 10, msc = 10,
  cpl = 10, jar = 10, reg = 10, scf = 10, inf = 10, chm = 10, application = 10, gadget = 10, appx = 10,
  appxbundle = 10, msix = 10, msixbundle = 10, iso = 10, img = 10, vhd = 10, vhdx = 10, xll = 10,
  sct = 10, dll = 10, sys = 10, url = 4, website = 4, settingcontent-ms = 10, library-ms = 10, svgz = 2,
};
bad_archive_extensions = {
  exe = 10, scr = 10, com = 10, pif = 10, bat = 10, cmd = 10, vbs = 10, vbe = 10, js = 10, jse = 10,
  wsf = 10, wsh = 10, hta = 10, ps1 = 10, lnk = 10, msi = 10, cpl = 10, jar = 10, reg = 10, scf = 10,
