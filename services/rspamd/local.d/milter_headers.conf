use = ["authentication-results", "x-spamd-bar", "x-spam-level", "x-virus"];
authenticated_headers = ["authentication-results"];
routines {
  # X-Virus lists antivirus findings (macros, encrypted archives…); the webmail shows them as a
  # warning. A header with this name that came with the letter is removed first.
  x-virus {
    header = "X-Virus";
    remove = 1;
    symbols = ["CLAM_VIRUS", "CLAM_SANE_MALWARE", "CLAM_SANE_SPAM", "CLAM_MACRO", "CLAM_ENCRYPTED", "CLAM_HEURISTIC", "CLAM_VIRUS_ENCRYPTED", "CLAM_LIMITS"];
  }
  # Drop Authentication-Results headers that came with the message (a sender could forge
  # "dmarc=pass"); only our own verdict stays. The webmail trusts this header for BIMI logos.
  authentication-results {
    header = "Authentication-Results";
    remove = 1;
  }
}
