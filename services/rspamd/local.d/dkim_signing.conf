# Keys are created by "zmail dkim gen <domain>": /var/lib/rspamd/dkim/<domain>.<selector>.key
enabled = true;
path = "/var/lib/rspamd/dkim/$domain.$selector.key";
selector_map = "/var/lib/rspamd/dkim/selectors.map";
selector = "z2026";
allow_username_mismatch = true;
sign_authenticated = true;
sign_local = true;
use_esld = true;
try_fallback = false;
