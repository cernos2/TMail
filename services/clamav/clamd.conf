# TMAIL antivirus daemon. Listens on loopback only (host networking): Rspamd scans every incoming
# letter through it, the webmail scans collector imports, outgoing attachments and large files.
LogFile /var/log/clamav/clamd.log
LogTime yes
LogFileMaxSize 20M
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 127.0.0.1
User clamav

# Files are scanned whole, up to the 2 GB of a file link (clamd works on a temp file on disk, not in RAM).
# Whatever goes beyond a limit (a "zip bomb", a 100-level archive) is reported as
# Heuristics.Limits.Exceeded and counts as NOT checked: the webmail does not hand it out.
MaxScanSize 4000M
MaxFileSize 2100M
StreamMaxLength 2100M
AlertExceedsMax yes
MaxRecursion 12
MaxFiles 5000
MaxThreads 4
ReadTimeout 1800
CommandReadTimeout 30

# Heuristic findings are reported only when no real virus is found; Rspamd turns them into
# warnings (macros, password-protected archives) instead of rejecting the letter.
AlertOLE2Macros yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertBrokenExecutables yes
AlertPhishingSSLMismatch no
AlertPhishingCloak no
HeuristicScanPrecedence no

# The server has little RAM: never hold two copies of the signatures while reloading.
ConcurrentDatabaseReload no
SelfCheck 3600
