# Cisco blocks database.clamav.net for Russian IP addresses (HTTP 403), so the official databases
# come from Microsoft's mirror of them. Full files only: the mirror has no incremental updates.
UpdateLogFile /var/log/clamav/freshclam.log
LogTime yes
DatabaseOwner clamav
PrivateMirror https://packages.microsoft.com/clamav/
ScriptedUpdates no
Checks 6
NotifyClamd /etc/clamav/clamd.conf
ConnectTimeout 30
ReceiveTimeout 600

# SaneSecurity: free extra signatures for mail threats (phishing, malicious macros, scam).
# Rspamd treats the spam/phishing ones as a score, the malware ones as a virus.
