# Validating recursive resolver for Rspamd (DNS blocklists, SPF, DKIM, DMARC lookups).
server:
  interface: 127.0.0.1
  port: 8053
  access-control: 127.0.0.0/8 allow
  do-ip6: no
  username: "unbound"
  directory: "/etc/unbound"
  chroot: ""
  pidfile: ""
  use-syslog: no
  logfile: ""
  verbosity: 1
  num-threads: 1
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes
  prefetch: yes
  module-config: "validator iterator"
  cache-min-ttl: 60
  auto-trust-anchor-file: "/var/lib/unbound/root.key"
