# Mail login brute-force protection. Services run with host networking, so INPUT-chain bans apply.
[DEFAULT]
# The server's own address is added by install.sh.
ignoreip = 127.0.0.1/8 ::1

[zmail-dovecot]
enabled  = true
backend  = systemd
filter   = zmail-dovecot
port     = 143,993,995,4190
maxretry = 8
findtime = 10m
bantime  = 1h

[zmail-postfix]
enabled  = true
backend  = systemd
filter   = zmail-postfix
port     = 25,465,587
maxretry = 8
findtime = 10m
bantime  = 1h
