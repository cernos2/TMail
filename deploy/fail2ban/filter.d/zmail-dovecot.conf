# Failed IMAP/POP3/ManageSieve logins (Dovecot container logs via journald)
[Definition]
failregex = (?:imap|pop3|managesieve)-login: (?:Info: )?(?:Aborted login|Disconnected|Login aborted)[^(]*\((?:auth failed|tried to use disallowed|tried to use disabled)[^)]*\).*\brip=<HOST>\b
journalmatch = CONTAINER_NAME=zmail-dovecot-1
